<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>valagamer</title>
<style>
  body {
    background: #0d1117;
    color: #00ff9f;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-size: 2rem;
  }
  #countdown {
    font-size: 3rem;
    letter-spacing: 2px;
  }
  .label {
    font-size: 1.2rem;
    color: #888;
  }
</style>
</head>
<body>

<div id="countdown">در حال بارگذاری...</div>
<div class="label">تا ۲۲ اردیبهشت ۱۴۰۵</div>

<script>
// 📅 تبدیل ۲۲ اردیبهشت ۱۴۰۵ به میلادی ≈ 2026-05-12
const targetDate = new Date("2026-05-12T00:00:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const distance = targetDate - now;

  if (distance <= 0) {
    document.getElementById("countdown").innerText = "زمان رسید!";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);
  const milliseconds = Math.floor((distance % 1000) / 10); // صدم‌ثانیه (00 تا 99)

  document.getElementById("countdown").innerText = 
    `${days.toString().padStart(2, '0')}روز : ${hours.toString().padStart(2, '0')}ساعت : ${minutes.toString().padStart(2, '0')}دقیقه : ${seconds.toString().padStart(2, '0')}ثانیه : ${milliseconds.toString().padStart(2, '0')}صدم`;
}

// 🎯 آپدیت هر 10 میلی‌ثانیه برای روون بودن صدم‌ثانیه
setInterval(updateCountdown, 10);
</script>

</body>
</html>
